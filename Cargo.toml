[package]
name = "yap"
version = "0.1.0"
edition = "2024"
description = "An experimental native coding agent with a Ratatui interface"
license = "MIT"
readme = "README.md"
repository = "https://github.com/fdemir/yap"

[dependencies]
async-stream = "0.3"
async-trait = "0.1"
cap-fs-ext = "4"
cap-std = "4"
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
ratatui = "0.30"
regex = "1"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1.1"
thiserror = "2"
tokio-util = { version = "0.7", features = ["rt"] }
unicode-width = "0.2"

[dependencies.tokio]
version = "1"
features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"]

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread"] }
